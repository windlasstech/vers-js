name: Quality Gates

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-gates:
    name: Quality gates
    runs-on: ubuntu-24.04

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.17.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "^2"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: pnpm ci

      - name: Run Markdownlint
        run: pnpm run lint:md

      - name: Run Oxlint
        run: pnpm run lint:ts:github

      - name: Check formatting
        run: pnpm run fmt:check

      - name: Type-check package
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm run test:coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          disable_search: true
          disable_telem: true
          fail_ci_if_error: true
          files: ./coverage/lcov.info
          report_type: "coverage"
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          disable_search: true
          disable_telem: true
          fail_ci_if_error: true
          files: ./test-report.junit.xml
          report_type: "test_results"
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

      - name: Build package
        run: pnpm run build

      - name: Check package artifacts
        run: node tests/runtime-smoke/package-artifacts.mjs

      - name: Type-check package consumer
        run: tsc -p tests/types/tsconfig.package.json

      - name: Type-check blocked package subpaths
        run: node tests/runtime-smoke/blocked-subpath-typecheck.mjs

      - name: Run package-name smoke test
        run: node tests/runtime-smoke/package-name.mjs

      - name: Run runtime smoke tests
        run: pnpm run smoke:runtime
