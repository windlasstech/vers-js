name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description:
          "Existing signed release tag to publish (for example v0.1.2). The reusable workflow builds
          the tag content via its source-ref input regardless of the dispatch ref, and provenance
          binds to the tag commit."
        required: true
        type: string

permissions: {}

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      release-tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref:
            ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          persist-credentials: false

      - name: Guard workflow_dispatch release tag shape
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release_tag must name an existing signed release tag (for example v0.1.2), got: $RELEASE_TAG" >&2
            echo "The reusable workflow builds the tag content via its source-ref input and fails closed if the tag does not resolve." >&2
            exit 1
          fi

      - name: Resolve release tag
        id: release
        env:
          RELEASE_TAG:
            ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.17.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "^2"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Verify release tag and changelog
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const tagName = process.env.RELEASE_TAG;

          if (!tagName || !/^v\d+\.\d+\.\d+$/.test(tagName)) {
            throw new Error(`release tag must match vX.Y.Z, got ${JSON.stringify(tagName)}`);
          }

          const packageJson = JSON.parse(readFileSync("package.json", "utf8"));
          const expectedTagName = `v${packageJson.version}`;

          if (tagName !== expectedTagName) {
            throw new Error(`release tag ${tagName} does not match package.json version ${packageJson.version}`);
          }

          const changelog = readFileSync("CHANGELOG.md", "utf8");
          const escapedVersion = packageJson.version.replace(/[.*+?^${}()|[\]\\]/g, String.raw`\$&`);
          const headingPattern = new RegExp(`^## \\[${escapedVersion}\\] - 12\\d{3}-\\d{2}-\\d{2}\\s*$`, "m");

          if (!headingPattern.test(changelog)) {
            throw new Error(`CHANGELOG.md must contain a Human Era section for ${packageJson.version}`);
          }
          NODE

      - name: Install dependencies
        run: pnpm ci

      - name: Check formatting
        run: pnpm run fmt:check

      - name: Run Oxlint
        run: pnpm run lint:ts:github

      - name: Run Markdownlint
        run: pnpm run lint:md

      - name: Type-check package
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm run test

      - name: Run coverage
        run: pnpm run test:coverage

      - name: Build package
        run: pnpm run build

      - name: Verify package artifacts
        run: pnpm run verify:package

      - name: Verify runtime smoke tests
        run: pnpm run verify:runtime

  publish:
    name: Publish to npm via slsa-builder
    needs: [verify]
    permissions:
      contents: read
      id-token: write
    uses: windlasstech/slsa-builder/.github/workflows/js-ts-npm-package-slsa3.yml@5964b19c5e4fa704595acbbe2ae30cc99fcbeb41 # main, pre-release
    with:
      package-directory: "."
      source-ref:
        ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag)
        || '' }}
      access: public
      dist-tag: latest

  release:
    name: Publish GitHub Release
    needs: [verify, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.release-tag }}
          persist-credentials: false

      - name: Download release tarball artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: js-ts-npm-package-tarball-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Download provenance bundle artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: js-ts-npm-provenance-bundle-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify tarball digests
        env:
          TARBALL_NAME: ${{ needs.publish.outputs.package-tarball-name }}
          EXPECTED_SHA256: ${{ needs.publish.outputs.package-tarball-sha256 }}
          EXPECTED_SHA512: ${{ needs.publish.outputs.package-tarball-sha512 }}
        run: |
          ACTUAL_SHA256="$(sha256sum "$TARBALL_NAME" | cut -d ' ' -f 1)"
          ACTUAL_SHA512="$(sha512sum "$TARBALL_NAME" | cut -d ' ' -f 1)"

          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ] || [ "$ACTUAL_SHA512" != "$EXPECTED_SHA512" ]; then
            echo "Tarball digest mismatch for $TARBALL_NAME" >&2
            echo "sha256 expected: $EXPECTED_SHA256" >&2
            echo "sha256 actual:   $ACTUAL_SHA256" >&2
            echo "sha512 expected: $EXPECTED_SHA512" >&2
            echo "sha512 actual:   $ACTUAL_SHA512" >&2
            exit 1
          fi

      - name: Verify provenance bundle subject
        env:
          TARBALL_NAME: ${{ needs.publish.outputs.package-tarball-name }}
          PACKAGE_NAME: ${{ needs.publish.outputs.package-name }}
          PACKAGE_VERSION: ${{ needs.publish.outputs.package-version }}
          EXPECTED_SHA256: ${{ needs.publish.outputs.package-tarball-sha256 }}
          EXPECTED_SHA512: ${{ needs.publish.outputs.package-tarball-sha512 }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const tarballName = process.env.TARBALL_NAME;
          const packageName = process.env.PACKAGE_NAME;
          const packageVersion = process.env.PACKAGE_VERSION;
          const expectedSha256 = process.env.EXPECTED_SHA256;
          const expectedSha512 = process.env.EXPECTED_SHA512;

          const envelopeLine = readFileSync(`${tarballName}.intoto.jsonl`, "utf8").trim();
          const envelope = JSON.parse(envelopeLine);
          const payload = JSON.parse(Buffer.from(envelope.payload, "base64").toString("utf8"));

          if (!Array.isArray(payload.subject) || payload.subject.length !== 1) {
            throw new Error("provenance payload subject must be an array of length 1");
          }

          const [subject] = payload.subject;

          // slsa-builder names the subject with the npm package PURL (ADR 0064), not the tarball
          // filename. PURL text passes through unchanged for lowercase alphanumeric and -._~.
          const expectedSubjectName = packageName.startsWith("@")
            ? `pkg:npm/%40${packageName.slice(1)}@${packageVersion}`
            : `pkg:npm/${packageName}@${packageVersion}`;

          if (subject.name !== expectedSubjectName) {
            throw new Error(`provenance subject name ${subject.name} does not match ${expectedSubjectName}`);
          }

          if (subject.digest?.sha512 !== expectedSha512) {
            throw new Error("provenance subject sha512 does not match the verified tarball digest");
          }

          if (subject.digest?.sha256 !== expectedSha256) {
            throw new Error("provenance subject sha256 does not match the verified tarball digest");
          }
          NODE

      - name: Write checksum sidecars
        env:
          TARBALL_NAME: ${{ needs.publish.outputs.package-tarball-name }}
        run: |
          sha256sum "$TARBALL_NAME" > "${TARBALL_NAME}.sha256"
          sha512sum "$TARBALL_NAME" > "${TARBALL_NAME}.sha512"

      - name: Extract release notes
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.release-tag }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const tagName = process.env.RELEASE_TAG;
          const version = tagName?.replace(/^v/, "");

          if (!tagName || !version) {
            throw new Error("RELEASE_TAG must contain the release tag");
          }

          const changelog = readFileSync("CHANGELOG.md", "utf8");
          const escapedVersion = version.replace(/[.*+?^${}()|[\]\\]/g, String.raw`\$&`);
          const headingPattern = new RegExp(`^## \\[${escapedVersion}\\] - 12\\d{3}-\\d{2}-\\d{2}\\s*$`, "m");
          const headingMatch = headingPattern.exec(changelog);

          if (!headingMatch) {
            throw new Error(`CHANGELOG.md must contain a Human Era section for ${version}`);
          }

          const sectionStart = headingMatch.index + headingMatch[0].length;
          const remainingChangelog = changelog.slice(sectionStart);
          const nextHeadingIndex = remainingChangelog.search(/^## /m);
          const linkReferenceIndex = remainingChangelog.search(/^\[[^\]]+\]: /m);
          const terminators = [nextHeadingIndex, linkReferenceIndex].filter((index) => index !== -1);
          const sectionEnd = terminators.length === 0 ? remainingChangelog.length : Math.min(...terminators);
          const notes = remainingChangelog.slice(0, sectionEnd).trim();

          if (notes === "") {
            throw new Error(`CHANGELOG.md section for ${version} must not be empty`);
          }

          writeFileSync("release-notes.md", `${notes}\n`, "utf8");
          NODE

      - name: Publish GitHub Release with assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.release-tag }}
          TARBALL_NAME: ${{ needs.publish.outputs.package-tarball-name }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes-file release-notes.md \
            "$TARBALL_NAME" \
            "${TARBALL_NAME}.sha256" \
            "${TARBALL_NAME}.sha512" \
            "${TARBALL_NAME}.intoto.jsonl"
